<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙卷风粒子系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #1a1a2e, #2d1f3d, #3d2a4e);
            font-family: Arial, sans-serif;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas {
            display: block;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 165, 0, 0.8);
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="info">
            龙卷风粒子系统<br>
            粒子数: 8000<br>
            拖动鼠标旋转视角
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 场景设置
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.0008);

        // 相机设置
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            2000
        );
        camera.position.set(80, 60, 100);
        camera.lookAt(0, 0, 0);

        // 渲染器设置
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('container').appendChild(renderer.domElement);

        // 粒子参数
        const PARTICLE_COUNT = 8000;
        const TORNADO_HEIGHT = 120;
        const MAX_RADIUS = 40;
        const ROTATION_SPEED = 0.008;
        const WAVE_SPEED = 0.015;
        const WAVE_AMPLITUDE = 3;
        
        // 鼠标影响参数
        const MOUSE_INFLUENCE_RADIUS = 60;
        const MAX_SPEED_BOOST = 2.5;
        const DEFLECTION_STRENGTH = 0.15;

        // 创建粒子几何体
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);
        const initialAngles = new Float32Array(PARTICLE_COUNT);
        const initialHeights = new Float32Array(PARTICLE_COUNT);
        const initialRadii = new Float32Array(PARTICLE_COUNT);
        const initialWaveOffsets = new Float32Array(PARTICLE_COUNT);

        // 颜色插值函数：白 -> 橙
        function lerpColor(t) {
            // t: 0 (中心) -> 1 (外围)
            const r = 1.0;
            const g = 1.0 - t * 0.6; // 从1.0降到0.4
            const b = 1.0 - t;       // 从1.0降到0
            
            return new THREE.Color(r, g, b);
        }

        // 初始化粒子位置和颜色
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // 高度：从底部到顶部分布
            const heightFactor = Math.random();
            const height = (heightFactor - 0.5) * TORNADO_HEIGHT;
            
            // 半径：底部宽，顶部窄（锥形）
            const radiusBase = MAX_RADIUS * (0.3 + 0.7 * (1 - heightFactor));
            const radius = radiusBase * Math.sqrt(Math.random()); // 让粒子更靠近中心
            
            // 角度：随机分布
            const angle = Math.random() * Math.PI * 2;
            
            // 计算初始位置
            const x = Math.cos(angle) * radius;
            const y = height;
            const z = Math.sin(angle) * radius;
            
            // 存储初始参数用于动画
            initialAngles[i] = angle;
            initialHeights[i] = y;
            initialRadii[i] = radius;
            initialWaveOffsets[i] = Math.random() * Math.PI * 2;
            
            // 设置位置
            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;
            
            // 设置颜色：根据距离中心的远近
            const colorFactor = radius / MAX_RADIUS; // 0 (中心) -> 1 (外围)
            const color = lerpColor(colorFactor);
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
            
            // 设置大小：外围粒子稍大
            sizes[i] = 0.5 + colorFactor * 1.0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 创建粒子材质
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                pointTexture: { value: null }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                
                void main() {
                    float distanceToCenter = length(gl_PointCoord - vec2(0.5));
                    if (distanceToCenter > 0.5) {
                        discard;
                    }
                    
                    // 更亮的核心，更柔和的边缘
                    float alpha = 1.0 - smoothstep(0.0, 0.5, distanceToCenter);
                    alpha = pow(alpha, 0.7); // 让边缘更柔和
                    alpha *= 0.95; // 提高整体透明度
                    
                    // 增强核心发光效果
                    float coreIntensity = 1.0 - smoothstep(0.0, 0.3, distanceToCenter);
                    vec3 finalColor = vColor * (1.0 + coreIntensity * 0.5);
                    
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        // 创建粒子系统
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0x808080, 1.5);
        scene.add(ambientLight);

        // 添加点光源（橙色光，增强氛围）
        const pointLight1 = new THREE.PointLight(0xffa500, 3, 250);
        pointLight1.position.set(0, 40, 0);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffcc00, 2.5, 200);
        pointLight2.position.set(0, -30, 0);
        scene.add(pointLight2);
        
        // 添加两个侧光源，增强粒子的立体感
        const pointLight3 = new THREE.PointLight(0xff8800, 2, 180);
        pointLight3.position.set(50, 20, 50);
        scene.add(pointLight3);
        
        const pointLight4 = new THREE.PointLight(0xffaa00, 1.8, 180);
        pointLight4.position.set(-50, 10, -50);
        scene.add(pointLight4);

        // 鼠标交互变量
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        
        // 鼠标3D位置（用于粒子影响）
        let mouse3DPosition = new THREE.Vector3(0, 0, 0);
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // 鼠标事件监听
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('mousemove', (e) => {
            // 转换鼠标坐标到标准化设备坐标
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            // 更新射线投射
            raycaster.setFromCamera(mouse, camera);
            
            // 计算与龙卷风中心平面（y=0平面）的交点
            const planeNormal = new THREE.Vector3(0, 1, 0);
            const planePoint = new THREE.Vector3(0, 0, 0);
            const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, planePoint);
            
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersectPoint);
            
            if (intersectPoint) {
                mouse3DPosition.copy(intersectPoint);
            }
            
            if (isDragging) {
                const deltaX = e.clientX - previousMouseX;
                const deltaY = e.clientY - previousMouseY;
                
                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;
                
                targetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotationX));
                
                previousMouseX = e.clientX;
                previousMouseY = e.clientY;
            }
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            
            // 更新粒子位置
            const positions = geometry.attributes.position.array;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const initialAngle = initialAngles[i];
                const initialHeight = initialHeights[i];
                const initialRadius = initialRadii[i];
                const waveOffset = initialWaveOffsets[i];
                
                // 计算粒子当前的基础位置（无鼠标影响时）
                const baseAngle = initialAngle + time * ROTATION_SPEED * 60;
                const baseWaveOffsetY = Math.sin(time * WAVE_SPEED * 60 + waveOffset) * WAVE_AMPLITUDE;
                const baseRadiusWave = 1 + Math.sin(time * WAVE_SPEED * 30 + waveOffset * 2) * 0.02;
                const baseRadius = initialRadius * baseRadiusWave;
                
                let baseX = Math.cos(baseAngle) * baseRadius;
                let baseY = initialHeight + baseWaveOffsetY;
                let baseZ = Math.sin(baseAngle) * baseRadius;
                
                // 计算粒子与鼠标的距离（忽略Y轴，主要在平面上影响）
                const distanceToMouse = Math.sqrt(
                    Math.pow(baseX - mouse3DPosition.x, 2) + 
                    Math.pow(baseZ - mouse3DPosition.z, 2)
                );
                
                // 计算鼠标影响因子：距离越近，影响越大
                // 使用平滑的指数衰减函数
                let speedBoost = 1;
                let deflectionFactor = 0;
                
                if (distanceToMouse < MOUSE_INFLUENCE_RADIUS) {
                    const influenceRatio = 1 - (distanceToMouse / MOUSE_INFLUENCE_RADIUS);
                    const smoothInfluence = influenceRatio * influenceRatio; // 平方让衰减更平滑
                    
                    // 速度提升：基础速度 * (1 + 额外倍数 * 影响因子)
                    speedBoost = 1 + (MAX_SPEED_BOOST - 1) * smoothInfluence;
                    
                    // 偏转强度
                    deflectionFactor = DEFLECTION_STRENGTH * smoothInfluence;
                }
                
                // 应用速度提升后的旋转
                const boostedAngle = initialAngle + time * ROTATION_SPEED * 60 * speedBoost;
                
                // 重新计算应用速度提升后的基础位置
                let finalX = Math.cos(boostedAngle) * baseRadius;
                let finalY = initialHeight + baseWaveOffsetY;
                let finalZ = Math.sin(boostedAngle) * baseRadius;
                
                // 应用向鼠标位置的偏转
                if (deflectionFactor > 0) {
                    // 计算从粒子指向鼠标的方向向量
                    const dirX = mouse3DPosition.x - finalX;
                    const dirZ = mouse3DPosition.z - finalZ;
                    
                    // 归一化方向（简化的2D归一化）
                    const dirLength = Math.sqrt(dirX * dirX + dirZ * dirZ);
                    if (dirLength > 0.0001) {
                        const normalizedDirX = dirX / dirLength;
                        const normalizedDirZ = dirZ / dirLength;
                        
                        // 应用偏转
                        // 偏转强度与距离相关，越近偏转越强
                        const deflection = deflectionFactor * (MOUSE_INFLUENCE_RADIUS - distanceToMouse);
                        
                        finalX += normalizedDirX * deflection;
                        finalZ += normalizedDirZ * deflection;
                        
                        // 稍微的Y轴吸引效果
                        const yDiff = mouse3DPosition.y - finalY;
                        finalY += yDiff * deflectionFactor * 0.3;
                    }
                }
                
                positions[i * 3] = finalX;
                positions[i * 3 + 1] = finalY;
                positions[i * 3 + 2] = finalZ;
            }
            
            geometry.attributes.position.needsUpdate = true;
            
            // 相机旋转动画（自动缓慢旋转）
            if (!isDragging) {
                targetRotationY += 0.001;
            }
            
            // 平滑相机旋转
            const radius = 140;
            camera.position.x = radius * Math.sin(targetRotationY) * Math.cos(targetRotationX);
            camera.position.y = 60 + radius * Math.sin(targetRotationX) * 0.5;
            camera.position.z = radius * Math.cos(targetRotationY) * Math.cos(targetRotationX);
            camera.lookAt(0, 0, 0);
            
            // 光源随相机旋转
            pointLight1.position.x = Math.cos(time * 0.3) * 50;
            pointLight1.position.z = Math.sin(time * 0.3) * 50;
            
            pointLight2.position.x = Math.sin(time * 0.5) * 40;
            pointLight2.position.z = Math.cos(time * 0.5) * 40;
            
            // 粒子组轻微整体旋转
            particles.rotation.y = time * 0.05;
            
            renderer.render(scene, camera);
        }

        // 启动动画
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 起伏山坡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script>
        // 初始化场景、相机和渲染器
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 添加OrbitControls控件，允许用户旋转视角
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 创建50x50的平面网格
        const geometry = new THREE.PlaneGeometry(50, 50, 50, 50);
        geometry.rotateX(-Math.PI / 2); // 将平面旋转到水平位置

        // 计算每个顶点的高度，使用正弦余弦函数创建起伏效果
        const vertices = geometry.attributes.position.array;
        const colors = [];
        
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const z = vertices[i + 2];
            
            // 使用正弦余弦函数计算高度，创建自然的起伏效果
            const height = Math.sin(x * 0.3) * Math.cos(z * 0.3) * 5 + 
                          Math.sin(x * 0.1 + 1) * Math.cos(z * 0.15 + 0.5) * 3;
            vertices[i + 1] = height;
            
            // 根据高度计算颜色，从绿色（低地）到棕色（高地）
            const normalizedHeight = (height + 8) / 16; // 归一化到0-1范围
            
            // 绿色到棕色的渐变
            const r = Math.floor(34 + normalizedHeight * (139 - 34));
            const g = Math.floor(139 - normalizedHeight * (139 - 69));
            const b = Math.floor(34 + normalizedHeight * (19 - 34));
            
            colors.push(r / 255, g / 255, b / 255);
        }
        
        // 添加颜色属性到几何体
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        
        // 创建材质，使用顶点颜色
        const material = new THREE.MeshLambertMaterial({
            vertexColors: true,
            side: THREE.DoubleSide
        });
        
        // 创建网格对象
        const terrain = new THREE.Mesh(geometry, material);
        scene.add(terrain);

        // 添加环境光和方向光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 设置相机位置
        camera.position.set(30, 20, 30);
        camera.lookAt(0, 0, 0);

        // 窗口大小调整事件
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 隧道穿梭 - 时空穿越</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">3D 隧道穿梭效果 - 穿越时空</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let tunnel, innerTunnel, outerTunnel, particles;
        let innerRing, middleRing, outerRing;
        let time = 0;
        let speed = 0.2;
        let isPaused = false;

        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 1, 100);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2;

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000);
            document.body.appendChild(renderer.domElement);

            // 创建隧道
            createTunnel();

            // 创建粒子系统
            createParticles();

            // 添加光源
            addLights();

            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);

            // 点击暂停/继续
            document.addEventListener('click', togglePause);

            // 开始动画循环
            animate();
        }

        function togglePause() {
            isPaused = !isPaused;
            const info = document.getElementById('info');
            if (isPaused) {
                info.innerHTML = '已暂停 - 点击继续';
            } else {
                info.innerHTML = '3D 隧道穿梭效果 - 穿越时空';
            }
        }

        function createTunnel() {
            const geometry = new THREE.CylinderGeometry(5, 5, 100, 48, 200, true);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.4,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            
            tunnel = new THREE.Mesh(geometry, material);
            tunnel.rotation.x = Math.PI / 2;
            scene.add(tunnel);

            // 创建多个隧道层
            createAdditionalTunnels();
            
            // 创建光晕粒子环
            createGlowRings();
        }

        function createAdditionalTunnels() {
            // 内圈隧道
            const innerGeometry = new THREE.CylinderGeometry(4, 4, 100, 48, 200, true);
            const innerMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                wireframe: true,
                transparent: true,
                opacity: 0.3,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            
            innerTunnel = new THREE.Mesh(innerGeometry, innerMaterial);
            innerTunnel.rotation.x = Math.PI / 2;
            scene.add(innerTunnel);

            // 外圈隧道
            const outerGeometry = new THREE.CylinderGeometry(6, 6, 100, 48, 200, true);
            const outerMaterial = new THREE.MeshBasicMaterial({
                color: 0xff00ff,
                wireframe: true,
                transparent: true,
                opacity: 0.25,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            
            outerTunnel = new THREE.Mesh(outerGeometry, outerMaterial);
            outerTunnel.rotation.x = Math.PI / 2;
            scene.add(outerTunnel);
        }

        function createGlowRings() {
            // 创建光晕粒子环的函数
            function createRing(radius, color, particleCount, opacity) {
                const geometry = new THREE.BufferGeometry();
                const positions = [];
                const colors = [];
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    // 在圆环上随机分布粒子，稍微偏离完美圆环
                    const r = radius + (Math.random() - 0.5) * 0.2;
                    const z = (Math.random() - 0.5) * 100;
                    
                    positions.push(
                        Math.cos(angle) * r,
                        Math.sin(angle) * r,
                        z
                    );
                    
                    const colorObj = new THREE.Color(color);
                    colors.push(colorObj.r, colorObj.g, colorObj.b);
                }
                
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.15,
                    vertexColors: true,
                    transparent: true,
                    opacity: opacity,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true
                });
                
                const ring = new THREE.Points(geometry, material);
                ring.rotation.x = Math.PI / 2;
                return ring;
            }
            
            // 内圈光晕环
            innerRing = createRing(4, 0x00ffff, 500, 0.6);
            scene.add(innerRing);
            
            // 中圈光晕环
            middleRing = createRing(5, 0xffffff, 600, 0.5);
            scene.add(middleRing);
            
            // 外圈光晕环
            outerRing = createRing(6, 0xff00ff, 700, 0.4);
            scene.add(outerRing);
        }

        function createParticles() {
            const particleCount = 1000;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];

            const colorPalette = [0x00ffff, 0xff00ff, 0xffff00, 0x00ff00, 0xff0000];

            for (let i = 0; i < particleCount; i++) {
                const x = (Math.random() - 0.5) * 20;
                const y = (Math.random() - 0.5) * 20;
                const z = (Math.random() - 0.5) * 200;
                
                positions.push(x, y, z);

                const color = new THREE.Color(colorPalette[Math.floor(Math.random() * colorPalette.length)]);
                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function addLights() {
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x00ffff, 1, 100);
            pointLight1.position.set(0, 0, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff00ff, 1, 100);
            pointLight2.position.set(0, 0, -10);
            scene.add(pointLight2);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                time += 0.005;
                speed = 0.2 + Math.sin(time * 0.3) * 0.1;

                // 移动相机（向前）
                camera.position.z -= speed;
                
                // 相机轻微摆动，增加穿梭感
                camera.position.x = Math.sin(time * 1) * 0.2;
                camera.position.y = Math.cos(time * 1) * 0.2;

                // 相机旋转
                camera.rotation.z = Math.sin(time * 0.2) * 0.05;

                // 重置相机位置，形成无限隧道效果
                if (camera.position.z < -50) {
                    camera.position.z = 50;
                }

                // 移动粒子
                const particlePositions = particles.geometry.attributes.position.array;
                for (let i = 2; i < particlePositions.length; i += 3) {
                    particlePositions[i] -= speed * 0.5;
                    if (particlePositions[i] < -100) {
                        particlePositions[i] = 100;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;

                // 粒子旋转
                particles.rotation.y = time * 0.08;
                particles.rotation.x = Math.sin(time * 0.15) * 0.05;

                // 隧道颜色渐变
                updateTunnelColors();

                // 光晕环动画
                updateGlowRings();
            }

            renderer.render(scene, camera);
        }

        function updateTunnelColors() {
            // 创建基础颜色
            const color1 = new THREE.Color();
            const color2 = new THREE.Color();
            const color3 = new THREE.Color();

            // 使用sin函数创建平滑的颜色过渡
            // 内圈隧道颜色变化
            const innerHue = Math.sin(time * 0.3) * 0.3 + 0.5;
            color1.setHSL(innerHue, 1.0, 0.5);
            innerTunnel.material.color = color1;

            // 中圈隧道颜色变化 (相位不同)
            const middleHue = Math.sin(time * 0.3 + Math.PI * 2/3) * 0.3 + 0.5;
            color2.setHSL(middleHue, 1.0, 0.7);
            tunnel.material.color = color2;

            // 外圈隧道颜色变化 (相位不同)
            const outerHue = Math.sin(time * 0.3 + Math.PI * 4/3) * 0.3 + 0.5;
            color3.setHSL(outerHue, 1.0, 0.6);
            outerTunnel.material.color = color3;
        }

        function updateGlowRings() {
            // 更新光晕环的颜色，与隧道保持一致
            const innerHue = Math.sin(time * 0.3) * 0.3 + 0.5;
            const middleHue = Math.sin(time * 0.3 + Math.PI * 2/3) * 0.3 + 0.5;
            const outerHue = Math.sin(time * 0.3 + Math.PI * 4/3) * 0.3 + 0.5;

            const innerColor = new THREE.Color().setHSL(innerHue, 1.0, 0.5);
            const middleColor = new THREE.Color().setHSL(middleHue, 1.0, 0.7);
            const outerColor = new THREE.Color().setHSL(outerHue, 1.0, 0.6);

            // 更新光晕环颜色
            const innerColors = innerRing.geometry.attributes.color.array;
            const middleColors = middleRing.geometry.attributes.color.array;
            const outerColors = outerRing.geometry.attributes.color.array;

            for (let i = 0; i < innerColors.length; i += 3) {
                innerColors[i] = innerColor.r;
                innerColors[i + 1] = innerColor.g;
                innerColors[i + 2] = innerColor.b;
            }
            innerRing.geometry.attributes.color.needsUpdate = true;

            for (let i = 0; i < middleColors.length; i += 3) {
                middleColors[i] = middleColor.r;
                middleColors[i + 1] = middleColor.g;
                middleColors[i + 2] = middleColor.b;
            }
            middleRing.geometry.attributes.color.needsUpdate = true;

            for (let i = 0; i < outerColors.length; i += 3) {
                outerColors[i] = outerColor.r;
                outerColors[i + 1] = outerColor.g;
                outerColors[i + 2] = outerColor.b;
            }
            outerRing.geometry.attributes.color.needsUpdate = true;

            // 光晕环轻微旋转动画
            innerRing.rotation.z = time * 0.2;
            middleRing.rotation.z = -time * 0.15;
            outerRing.rotation.z = time * 0.1;

            // 光晕环轻微大小脉动
            const pulseScale = 1 + Math.sin(time * 2) * 0.05;
            innerRing.scale.set(pulseScale, pulseScale, pulseScale);
            middleRing.scale.set(pulseScale * 0.95, pulseScale * 0.95, pulseScale * 0.95);
            outerRing.scale.set(pulseScale * 0.9, pulseScale * 0.9, pulseScale * 0.9);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 启动应用
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 弹跳球体场景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #1a1a2e;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // 场景、相机、渲染器
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // 球体数据数组
        const spheres = [];
        const sphereCount = 20;
        
        // 几何体和材质准备
        const geometry = new THREE.SphereGeometry(0.5, 32, 32);

        // 创建20个随机位置、随机颜色的球体
        for (let i = 0; i < sphereCount; i++) {
            // 随机颜色
            const color = new THREE.Color(
                Math.random(),
                Math.random(),
                Math.random()
            );
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.3
            });

            const sphere = new THREE.Mesh(geometry, material);
            
            // 随机位置（x和z在-8到8之间，y初始为0）
            sphere.position.x = (Math.random() - 0.5) * 16;
            sphere.position.y = Math.random() * 2;
            sphere.position.z = (Math.random() - 0.5) * 16;

            // 弹跳参数
            const bounceHeight = 1 + Math.random() * 2; // 弹跳高度 1-3
            const bounceSpeed = 2 + Math.random() * 3; // 弹跳速度 2-5
            const phase = Math.random() * Math.PI * 2; // 初始相位，让球体不同步

            spheres.push({
                mesh: sphere,
                baseY: sphere.position.y,
                bounceHeight: bounceHeight,
                bounceSpeed: bounceSpeed,
                phase: phase
            });

            scene.add(sphere);
        }

        // 相机位置
        camera.position.z = 15;
        camera.position.y = 5;
        camera.lookAt(0, 2, 0);

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();

            // 更新每个球体的位置
            spheres.forEach(sphereData => {
                const { mesh, baseY, bounceHeight, bounceSpeed, phase } = sphereData;
                
                // 使用正弦函数实现弹跳效果
                // y = baseY + bounceHeight * sin(bounceSpeed * time + phase)
                // 取绝对值实现上下弹跳（或者用正弦，正弦会自然上下）
                mesh.position.y = baseY + bounceHeight * Math.sin(bounceSpeed * elapsedTime + phase);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>

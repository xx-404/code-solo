<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 银河粒子系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-color: #000000;
        }
        
        canvas {
            display: block;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        
        #loading.hidden {
            display: none;
        }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="loading">正在加载银河系统...</div>
    
    <script>
        // ============================================
        // 颜色配置系统
        // ============================================
        const ColorSchemes = {
            default: {
                name: '默认银河配色',
                colors: [
                    new THREE.Color(0x4a9eff),
                    new THREE.Color(0xffffff),
                    new THREE.Color(0xd4b3ff),
                    new THREE.Color(0xffd700),
                    new THREE.Color(0xff6b6b)
                ],
                regionWeights: [
                    [0.0, 0.6, 0.0, 0.4, 0.0],
                    [0.5, 0.0, 0.5, 0.0, 0.0],
                    [0.7, 0.0, 0.0, 0.0, 0.3]
                ]
            },
            
            warm: {
                name: '暖色调配色',
                colors: [
                    new THREE.Color(0xff6b35),
                    new THREE.Color(0xffd700),
                    new THREE.Color(0xff8c00),
                    new THREE.Color(0xff4500),
                    new THREE.Color(0xffa500)
                ],
                regionWeights: [
                    [0.0, 0.5, 0.3, 0.2, 0.0],
                    [0.3, 0.4, 0.2, 0.1, 0.0],
                    [0.5, 0.2, 0.2, 0.1, 0.0]
                ]
            },
            
            cool: {
                name: '冷色调配色',
                colors: [
                    new THREE.Color(0x00bfff),
                    new THREE.Color(0x87ceeb),
                    new THREE.Color(0x4169e1),
                    new THREE.Color(0x0000cd),
                    new THREE.Color(0x1e90ff)
                ],
                regionWeights: [
                    [0.3, 0.5, 0.2, 0.0, 0.0],
                    [0.4, 0.3, 0.3, 0.0, 0.0],
                    [0.5, 0.2, 0.2, 0.1, 0.0]
                ]
            },
            
            purple: {
                name: '紫色系配色',
                colors: [
                    new THREE.Color(0x9370db),
                    new THREE.Color(0x8a2be2),
                    new THREE.Color(0xba55d3),
                    new THREE.Color(0xda70d6),
                    new THREE.Color(0xee82ee)
                ],
                regionWeights: [
                    [0.2, 0.3, 0.3, 0.2, 0.0],
                    [0.3, 0.3, 0.2, 0.2, 0.0],
                    [0.4, 0.2, 0.2, 0.1, 0.1]
                ]
            },
            
            green: {
                name: '绿色系配色',
                colors: [
                    new THREE.Color(0x00ff7f),
                    new THREE.Color(0x32cd32),
                    new THREE.Color(0x7cfc00),
                    new THREE.Color(0xadff2f),
                    new THREE.Color(0x98fb98)
                ],
                regionWeights: [
                    [0.3, 0.4, 0.2, 0.1, 0.0],
                    [0.4, 0.3, 0.2, 0.1, 0.0],
                    [0.5, 0.2, 0.2, 0.1, 0.0]
                ]
            }
        };
        
        // ============================================
        // GalaxySystem 类 - 工程化封装的粒子系统
        // ============================================
        class GalaxySystem {
            constructor(options = {}) {
                this.options = {
                    particleCount: 10000,
                    galaxyRadius: 25,
                    galaxyThickness: 2,
                    rotationSpeed: 0.0005,
                    colorScheme: ColorSchemes.default,
                    useTexture: false,
                    texturePath: null,
                    textureLoader: null,
                    onLoad: null,
                    onError: null,
                    ...options
                };
                
                this.isInitialized = false;
                this.isLoaded = false;
                this.particleData = null;
                this.geometry = null;
                this.material = null;
                this.points = null;
                this.texture = null;
                
                this._textureLoader = this.options.textureLoader || new THREE.TextureLoader();
            }
            
            static get ColorSchemes() {
                return ColorSchemes;
            }
            
            async init() {
                if (this.isInitialized) {
                    console.warn('GalaxySystem is already initialized');
                    return this;
                }
                
                try {
                    this._generateParticleData();
                    
                    if (this.options.useTexture && this.options.texturePath) {
                        await this._loadTexture();
                    }
                    
                    this._createGeometry();
                    this._createMaterial();
                    this._createPoints();
                    
                    this.isInitialized = true;
                    this.isLoaded = true;
                    
                    if (this.options.onLoad) {
                        this.options.onLoad(this);
                    }
                    
                    return this;
                } catch (error) {
                    console.error('Failed to initialize GalaxySystem:', error);
                    if (this.options.onError) {
                        this.options.onError(error);
                    }
                    throw error;
                }
            }
            
            _generateParticleData() {
                const { particleCount, galaxyRadius, galaxyThickness, colorScheme } = this.options;
                
                const positions = this._generatePositions(particleCount, galaxyRadius, galaxyThickness);
                const colors = this._generateColors(positions, particleCount, galaxyRadius, colorScheme);
                const { sizes, emissiveIntensities } = this._generateSizesAndEmissive(particleCount);
                
                this.particleData = { positions, colors, sizes, emissiveIntensities };
            }
            
            _generatePositions(particleCount, galaxyRadius, galaxyThickness) {
                const positions = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount; i++) {
                    const armCount = 4;
                    const armOffset = Math.random() * Math.PI * 2;
                    const radius = Math.random() * galaxyRadius;
                    const angle = (radius / galaxyRadius) * Math.PI * 2 * armCount + armOffset;
                    
                    const randomRadius = radius + (Math.random() - 0.5) * 2;
                    const randomAngle = angle + (Math.random() - 0.5) * 0.5;
                    
                    const x = Math.cos(randomAngle) * randomRadius;
                    const z = Math.sin(randomAngle) * randomRadius;
                    
                    const yDistribution = Math.exp(-radius * radius / (galaxyRadius * galaxyRadius * 0.5));
                    const y = (Math.random() - 0.5) * galaxyThickness * yDistribution;
                    
                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;
                }
                
                return positions;
            }
            
            _generateColors(positions, particleCount, galaxyRadius, colorScheme) {
                const colors = new Float32Array(particleCount * 3);
                const { colors: colorOptions, regionWeights } = colorScheme;
                
                for (let i = 0; i < particleCount; i++) {
                    const x = positions[i * 3];
                    const y = positions[i * 3 + 1];
                    const z = positions[i * 3 + 2];
                    
                    const distanceFromCenter = Math.sqrt(x * x + y * y + z * z);
                    
                    let regionIndex;
                    if (distanceFromCenter < galaxyRadius * 0.3) {
                        regionIndex = 0;
                    } else if (distanceFromCenter < galaxyRadius * 0.7) {
                        regionIndex = 1;
                    } else {
                        regionIndex = 2;
                    }
                    
                    const weights = regionWeights[regionIndex];
                    const colorIndex = this._selectWeightedIndex(weights);
                    
                    const color = colorOptions[colorIndex];
                    colors[i * 3] = color.r;
                    colors[i * 3 + 1] = color.g;
                    colors[i * 3 + 2] = color.b;
                }
                
                return colors;
            }
            
            _selectWeightedIndex(weights) {
                const totalWeight = weights.reduce((sum, w) => sum + w, 0);
                let random = Math.random() * totalWeight;
                
                for (let i = 0; i < weights.length; i++) {
                    random -= weights[i];
                    if (random <= 0) {
                        return i;
                    }
                }
                
                return weights.length - 1;
            }
            
            _generateSizesAndEmissive(particleCount) {
                const sizes = new Float32Array(particleCount);
                const emissiveIntensities = new Float32Array(particleCount);
                
                for (let i = 0; i < particleCount; i++) {
                    const sizeRandom = Math.random();
                    let particleSize;
                    let emissiveIntensity;
                    
                    if (sizeRandom > 0.95) {
                        particleSize = 0.4 + Math.random() * 0.6;
                        emissiveIntensity = 0.8 + Math.random() * 0.4;
                    } else if (sizeRandom > 0.7) {
                        particleSize = 0.2 + Math.random() * 0.2;
                        emissiveIntensity = 0.2 + Math.random() * 0.4;
                    } else {
                        particleSize = 0.05 + Math.random() * 0.15;
                        emissiveIntensity = 0.05 + Math.random() * 0.1;
                    }
                    
                    sizes[i] = particleSize;
                    emissiveIntensities[i] = emissiveIntensity;
                }
                
                return { sizes, emissiveIntensities };
            }
            
            async _loadTexture() {
                return new Promise((resolve, reject) => {
                    this._textureLoader.load(
                        this.options.texturePath,
                        (texture) => {
                            this.texture = texture;
                            this.texture.needsUpdate = true;
                            console.log('Texture loaded successfully:', this.options.texturePath);
                            resolve(texture);
                        },
                        undefined,
                        (error) => {
                            console.error('Failed to load texture:', error);
                            reject(error);
                        }
                    );
                });
            }
            
            _createGeometry() {
                if (!this.particleData) {
                    throw new Error('Particle data not generated');
                }
                
                this.geometry = new THREE.BufferGeometry();
                this.geometry.setAttribute('position', new THREE.BufferAttribute(this.particleData.positions, 3));
                this.geometry.setAttribute('color', new THREE.BufferAttribute(this.particleData.colors, 3));
                this.geometry.setAttribute('size', new THREE.BufferAttribute(this.particleData.sizes, 1));
                this.geometry.setAttribute('emissiveIntensity', new THREE.BufferAttribute(this.particleData.emissiveIntensities, 1));
            }
            
            _createMaterial() {
                const uniforms = {
                    uTime: { value: 0 },
                    uUseTexture: { value: this.options.useTexture && this.texture !== null },
                    uTexture: { value: this.texture }
                };
                
                const vertexShader = `
                    attribute float size;
                    attribute float emissiveIntensity;
                    varying vec3 vColor;
                    varying float vEmissiveIntensity;
                    varying vec2 vUv;
                    
                    void main() {
                        vColor = color;
                        vEmissiveIntensity = emissiveIntensity;
                        vUv = uv;
                        
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `;
                
                const fragmentShader = `
                    uniform sampler2D uTexture;
                    uniform bool uUseTexture;
                    varying vec3 vColor;
                    varying float vEmissiveIntensity;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 center = gl_PointCoord - vec2(0.5);
                        float dist = length(center);
                        
                        if (dist > 0.5) {
                            discard;
                        }
                        
                        float glow = 1.0 - smoothstep(0.0, 0.5, dist);
                        glow = pow(glow, 2.0);
                        
                        vec3 finalColor = vColor * (1.0 + vEmissiveIntensity * 2.0);
                        float alpha = 0.6 + vEmissiveIntensity * 0.4;
                        
                        if (uUseTexture) {
                            vec4 texColor = texture2D(uTexture, gl_PointCoord);
                            finalColor *= texColor.rgb;
                            alpha *= texColor.a;
                        }
                        
                        gl_FragColor = vec4(finalColor * glow, alpha * glow);
                    }
                `;
                
                this.material = new THREE.ShaderMaterial({
                    uniforms,
                    vertexShader,
                    fragmentShader,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    vertexColors: true,
                    depthWrite: false
                });
            }
            
            _createPoints() {
                if (!this.geometry || !this.material) {
                    throw new Error('Geometry or material not created');
                }
                
                this.points = new THREE.Points(this.geometry, this.material);
            }
            
            update(deltaTime = 0.016) {
                if (!this.isInitialized) return;
                
                if (this.material.uniforms.uTime) {
                    this.material.uniforms.uTime.value += deltaTime;
                }
                
                this.points.rotation.y += this.options.rotationSpeed;
            }
            
            getPoints() {
                return this.points;
            }
            
            getGeometry() {
                return this.geometry;
            }
            
            getMaterial() {
                return this.material;
            }
            
            setColorScheme(colorScheme) {
                if (!this.isInitialized || !this.particleData) {
                    this.options.colorScheme = colorScheme;
                    return;
                }
                
                const colors = this._generateColors(
                    this.particleData.positions,
                    this.options.particleCount,
                    this.options.galaxyRadius,
                    colorScheme
                );
                
                this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                this.geometry.attributes.color.needsUpdate = true;
                this.options.colorScheme = colorScheme;
            }
            
            setRotationSpeed(speed) {
                this.options.rotationSpeed = speed;
            }
            
            async setTexture(texturePath) {
                this.options.texturePath = texturePath;
                this.options.useTexture = true;
                
                await this._loadTexture();
                
                if (this.material) {
                    this.material.uniforms.uTexture.value = this.texture;
                    this.material.uniforms.uUseTexture.value = true;
                    this.material.needsUpdate = true;
                }
            }
            
            disableTexture() {
                this.options.useTexture = false;
                
                if (this.material) {
                    this.material.uniforms.uUseTexture.value = false;
                    this.material.needsUpdate = true;
                }
            }
            
            dispose() {
                if (this.geometry) {
                    this.geometry.dispose();
                }
                
                if (this.material) {
                    this.material.dispose();
                }
                
                if (this.texture) {
                    this.texture.dispose();
                }
                
                this.isInitialized = false;
                this.isLoaded = false;
                this.particleData = null;
                this.geometry = null;
                this.material = null;
                this.points = null;
                this.texture = null;
            }
        }
        
        // ============================================
        // 主程序
        // ============================================
        class App {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.galaxySystem = null;
                this.animationId = null;
                this.lastTime = 0;
            }
            
            async init() {
                this._setupScene();
                this._setupCamera();
                this._setupRenderer();
                this._setupControls();
                this._setupEventListeners();
                
                await this._createGalaxySystem();
                
                this._startAnimation();
                
                document.getElementById('loading').classList.add('hidden');
            }
            
            _setupScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x000011);
            }
            
            _setupCamera() {
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.set(0, 15, 30);
            }
            
            _setupRenderer() {
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                document.body.appendChild(this.renderer.domElement);
            }
            
            _setupControls() {
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.enableZoom = true;
                this.controls.enablePan = true;
            }
            
            _setupEventListeners() {
                window.addEventListener('resize', this._onResize.bind(this));
            }
            
            async _createGalaxySystem() {
                this.galaxySystem = new GalaxySystem({
                    particleCount: 10000,
                    galaxyRadius: 25,
                    galaxyThickness: 2,
                    rotationSpeed: 0.0005,
                    colorScheme: GalaxySystem.ColorSchemes.default,
                    useTexture: false,
                    onLoad: () => {
                        console.log('Galaxy system loaded successfully');
                    },
                    onError: (error) => {
                        console.error('Galaxy system error:', error);
                    }
                });
                
                await this.galaxySystem.init();
                
                const points = this.galaxySystem.getPoints();
                this.scene.add(points);
            }
            
            _onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
            
            _startAnimation() {
                this.lastTime = performance.now();
                this._animate();
            }
            
            _animate() {
                this.animationId = requestAnimationFrame(this._animate.bind(this));
                
                const currentTime = performance.now();
                const deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;
                
                if (this.galaxySystem) {
                    this.galaxySystem.update(deltaTime);
                }
                
                this.controls.update();
                
                this.renderer.render(this.scene, this.camera);
            }
            
            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                
                if (this.galaxySystem) {
                    this.galaxySystem.dispose();
                }
                
                if (this.renderer) {
                    this.renderer.dispose();
                }
                
                window.removeEventListener('resize', this._onResize.bind(this));
            }
        }
        
        // 启动应用
        const app = new App();
        app.init().catch((error) => {
            console.error('Failed to initialize app:', error);
            document.getElementById('loading').textContent = '加载失败: ' + error.message;
        });
    </script>
</body>
</html>

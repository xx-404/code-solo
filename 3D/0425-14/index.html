<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 魔方</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            perspective: 800px;
            overflow: hidden;
        }

        .scene {
            width: 200px;
            height: 200px;
            perspective: 600px;
            margin: 100px auto;
        }

        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-100px) rotateX(-20deg) rotateY(30deg);
            cursor: grab;
            transition: transform 0.1s ease-out;
        }

        .cube:active {
            cursor: grabbing;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid #d4c5b8;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
            background: #e8dfd6;
            backface-visibility: visible;
        }

        .tile {
            border-radius: 6px;
            border: 1px solid rgba(212, 197, 184, 0.5);
            box-shadow: inset 1px 1px 3px rgba(255, 255, 255, 0.4),
                        inset -1px -1px 3px rgba(0, 0, 0, 0.1);
        }

        /* 六个面的位置和马卡龙颜色 */
        .front {
            transform: rotateY(0deg) translateZ(100px);
        }
        .front .tile { background: #ffb5b5; }

        .back {
            transform: rotateY(180deg) translateZ(100px);
        }
        .back .tile { background: #ffd4a3; }

        .right {
            transform: rotateY(90deg) translateZ(100px);
        }
        .right .tile { background: #a3d4ff; }

        .left {
            transform: rotateY(-90deg) translateZ(100px);
        }
        .left .tile { background: #b5f0d0; }

        .top {
            transform: rotateX(90deg) translateZ(100px);
        }
        .top .tile { background: #e0d5f0; }

        .bottom {
            transform: rotateX(-90deg) translateZ(100px);
        }
        .bottom .tile { background: #fff5cc; }

        /* 标题 */
        .title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="title">3D 魔方</div>
    <div class="scene">
        <div class="cube">
            <!-- 前面 - 红色 -->
            <div class="face front">
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
            </div>
            <!-- 后面 - 橙色 -->
            <div class="face back">
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
            </div>
            <!-- 右面 - 蓝色 -->
            <div class="face right">
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
            </div>
            <!-- 左面 - 绿色 -->
            <div class="face left">
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
            </div>
            <!-- 上面 - 白色 -->
            <div class="face top">
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
            </div>
            <!-- 下面 - 黄色 -->
            <div class="face bottom">
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
                <div class="tile"></div><div class="tile"></div><div class="tile"></div>
            </div>
        </div>
    </div>

    <script>
        const cube = document.querySelector('.cube');
        let isDragging = false;
        let previousMousePosition = {
            x: 0,
            y: 0
        };
        let currentRotation = {
            x: -20,
            y: 30
        };

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
            cube.style.transition = 'none';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            cube.style.transition = 'transform 0.1s ease-out';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            currentRotation.y += deltaX * 0.5;
            currentRotation.x -= deltaY * 0.5;

            cube.style.transform = `translateZ(-100px) rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;

            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        document.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
            cube.style.transition = 'none';
        });

        document.addEventListener('touchend', () => {
            isDragging = false;
            cube.style.transition = 'transform 0.1s ease-out';
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            currentRotation.y += deltaX * 0.5;
            currentRotation.x -= deltaY * 0.5;

            cube.style.transform = `translateZ(-100px) rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;

            previousMousePosition = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        });
    </script>
</body>
</html>
